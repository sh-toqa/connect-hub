# Isolated in-memory database for automated tests only - never touches the
# local MySQL "connecthub" database that the dev profile uses.
spring.datasource.url=jdbc:h2:mem:connecthub_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema for every test run.
spring.jpa.hibernate.ddl-auto=create-drop

# Fixed, non-production value so `mvn test` runs standalone without
# requiring real secrets in the environment. Never used outside tests.
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1uZXZlci11c2UtaW4tcHJvZC10ZXN0LWVudmlyb25tZW50
