# Local development - MySQL on your machine.
# DB_HOST / DB_PORT / DB_NAME let you point at a different local/managed DB
# without touching this file. SQL_USERNAME / SQL_PASSWORD are required and
# must be set via environment variables (see backend/.env.example) - never
# committed here.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:connecthub}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SQL_USERNAME}
spring.datasource.password=${SQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# NOTE: create-drop wipes and recreates the schema on every restart. That's
# fine for local dev (and lets DataSeeder repopulate demo data each time);
# never use this outside dev - see application-prod.properties.
spring.jpa.hibernate.ddl-auto=create-drop

# Required - must be set via an environment variable, no default on purpose
# so the app fails fast instead of silently signing tokens with a weak key.
# Generate one with: openssl rand -base64 64
app.jwt.secret=${APP_JWT_SECRET}
