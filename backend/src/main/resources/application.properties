spring.application.name=backend

# Pool
# Applies to whichever datasource the active profile configures.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.show-sql=false

# Flyway
# Off by default: dev/test manage their own schema via Hibernate
# (ddl-auto=create-drop) and don't need migrations. Enabled explicitly in
# application-prod.properties, where Flyway - not Hibernate - owns schema
# creation.
spring.flyway.enabled=false

# Server
server.port=${SERVER_PORT:8080}

# JWT
# Secret is intentionally NOT defined here - it differs per environment
# (see application-dev/prod/test.properties) and must never have a shared
# default.
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS
# Must be set to the real frontend origin in staging/production.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# File Upload
# NOTE: this stores files on local disk. On most cloud hosts (containers,
# PaaS with ephemeral filesystems) this directory is wiped on every
# redeploy/restart. Before deploying, move to a persistent volume or
# object storage (e.g. S3-compatible bucket) - see the summary notes.
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Active profile is selected externally, never hardcoded here:
#   dev  -> SPRING_PROFILES_ACTIVE=dev or -Dspring-boot.run.profiles=dev
#   prod -> SPRING_PROFILES_ACTIVE=prod
#   test -> @ActiveProfiles("test") on the test classes
