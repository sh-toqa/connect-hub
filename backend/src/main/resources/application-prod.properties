# Production - point at your managed database via environment variables.
# No local fallback defaults on purpose: production must not silently fall
# back to localhost or an auto-created database the way dev does.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SQL_USERNAME}
spring.datasource.password=${SQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# NOTE: never use create-drop/update in production - it can silently alter
# or destroy a live schema. "validate" only checks the schema matches the
# entities - Flyway (below) is what actually creates/updates it.
spring.jpa.hibernate.ddl-auto=validate

# Flyway owns schema creation here - it runs its migrations
# (src/main/resources/db/migration) before Hibernate initializes, so
# ddl-auto=validate above always has a real schema to check against.
spring.flyway.enabled=true

# Required - must be set via an environment variable, no default on purpose.
app.jwt.secret=${APP_JWT_SECRET}
